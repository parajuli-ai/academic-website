- name: "Zeroth: evaluation-gated clinical multi-agent platform"
  stack: "Python, FastAPI, Next.js, PostgreSQL, Pydantic"
  year: 2026
  note: "Private repository"
  bullets:
    - "Genomics, imaging, radiomics and clinical-note agents each produce findings. An evaluation gate returns PASS, FLAG or BLOCK and refuses to display any claim without provenance; synthetic data cannot reach a report unlabeled."
    - "Security by design: timing-safe authentication, revocable sessions, per-source throttling, a PHI allowlist so patient identifiers never enter claims, logs or prompts, and an append-only audit log."

