{% assign pr = include.project %}
<div class="job">
  <p class="job-head"><strong>{{ pr.name }}</strong>{% if pr.demo %} · <a href="{{ pr.demo }}" target="_blank" rel="noopener">Live demo</a>{% endif %}{% if pr.url %} · <a href="{{ pr.url }}" target="_blank" rel="noopener">Code</a>{% endif %}{% if pr.docs %} · <a href="{{ pr.docs }}" target="_blank" rel="noopener">Docs</a>{% endif %}</p>
  <p class="job-meta">{{ pr.stack }} · {{ pr.year }}{% if pr.note %} · {{ pr.note }}{% endif %}</p>
  <ul>{% for b in pr.bullets %}<li>{{ b }}</li>{% endfor %}</ul>
</div>
